services:
  backend:
    build: ./backend
    environment:
      LLM_API_KEYS: ${LLM_API_KEYS:?Set two distinct provider keys in .env}
      LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-flash}
      LLM_MODELS: ${LLM_MODELS:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      DEFAULT_SYSTEM_PROMPT: ${DEFAULT_SYSTEM_PROMPT:-You are a helpful assistant. Keep simple factual answers to 1-3 sentences. Expand only when the user asks for detail or the task requires it. Use Markdown when useful.}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
      PORT: ${PORT:-8000}
    ports:
      - "127.0.0.1:8000:${PORT:-8000}"
    volumes:
      - sqlite_data:/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8000')+'/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true

volumes:
  sqlite_data:
